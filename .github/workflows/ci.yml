name: CI

# Not triggered by pull requests or other branches. Deploy calls this on every push
# (or merge) to main, so the checks run once there, before it ships (see deploy.yml).
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from "packageManager" in package.json, Node from .nvmrc.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec oxlint
      - name: Check formatting
        run: pnpm exec oxfmt --check
      - name: Check types
        run: pnpm check-types
      - name: Unit tests
        run: pnpm test

      # Builds the web app, then bundles the Worker without uploading it.
      - name: Build
        run: pnpm build

      # Drives the built app in a real browser against the Worker in `wrangler dev`,
      # with a stub in place of OpenRouter, so no secrets are needed here.
      - name: Install the browser for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm exec playwright test

      - name: Keep the Playwright report when a browser test fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
