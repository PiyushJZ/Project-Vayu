name: CI

on:
  pull_request:
  # Deploy runs these same checks before it ships (see deploy.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from "packageManager" in package.json, Node from .nvmrc.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec oxlint
      - name: Check formatting
        run: pnpm exec oxfmt --check
      - name: Check types
        run: pnpm check-types
      - name: Unit tests
        run: pnpm test

      # Builds the web app, then bundles the Worker without uploading it.
      - name: Build
        run: pnpm build

      # Drives the built app in a real browser against the Worker in `wrangler dev`,
      # with a stub in place of OpenRouter, so no secrets are needed here.
      - name: Install the browser for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm exec playwright test

      - name: Keep the Playwright report when a browser test fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
