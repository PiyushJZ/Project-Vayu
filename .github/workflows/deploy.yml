name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one that is halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    # A manual run from another branch still runs the checks, but never deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    # Naming the shell turns on pipefail, so a failed `wrangler deploy | tee` fails the step.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check that the Cloudflare secrets are set
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set. Add it under Settings > Secrets and variables > Actions. See the Deployment section of README.md."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter web build

      # One upload carries the Worker, the web app's files and the OpenRouter key.
      # The D1 database is found by name and created on the first deploy (see apps/server/wrangler.jsonc).
      - name: Deploy
        id: deploy
        working-directory: apps/server
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: |
          args=()
          if [ -n "$ACCESS_TEAM_DOMAIN" ] && [ -n "$ACCESS_AUD" ]; then
            args+=(--var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "ACCESS_AUD:$ACCESS_AUD")
          else
            echo "::warning::ACCESS_TEAM_DOMAIN and ACCESS_AUD are not set as repository variables, so the Worker does not check Cloudflare Access sign-ins. See the Access section of README.md."
          fi
          if [ -n "$OPENROUTER_API_KEY" ]; then
            jq -n --arg key "$OPENROUTER_API_KEY" '{ OPENROUTER_API_KEY: $key }' > "$RUNNER_TEMP/worker-secrets.json"
            args+=(--secrets-file "$RUNNER_TEMP/worker-secrets.json")
          else
            echo "::warning::The OPENROUTER_API_KEY secret is not set here, so the key already stored on the Worker (if any) is left as it is. Without a key the app shows code-written text only."
          fi
          pnpm exec wrangler deploy "${args[@]}" | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$RUNNER_TEMP/worker-secrets.json"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # A new workers.dev address can take a minute to start answering.
      - name: Check that the deployed app answers
        if: ${{ steps.deploy.outputs.url != '' }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 10 --retry-all-errors "${{ steps.deploy.outputs.url }}/api/health"
          echo
          echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
